<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Vale UI Components</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050608;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.58);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, 100%);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 16px;
        line-height: 24px;
      }

      a {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 18px;
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      a:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }

      span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UI Components</h1>
      <p>Interactive interface experiments and reusable components.</p>
      <a href="./compose-ai-box/">
        Compose Message AI Box
        <span>Open</span>
      </a>
    </main>
  </body>
</html>
